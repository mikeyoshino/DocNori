name: Deploy DocNory production

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docnory-production
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build images and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Validate branch input
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}
        run: git check-ref-format --branch "$DEPLOY_BRANCH"

      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Resolve image names
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          release_sha="$(git rev-parse HEAD)"
          echo "host=ghcr.io/${repository}-host" >> "$GITHUB_OUTPUT"
          echo "relay=ghcr.io/${repository}-relay" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push host image
        id: host
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.host }}:${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=host
          cache-to: type=gha,scope=host,mode=max

      - name: Build and push relay image
        id: relay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Relay.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.relay }}:${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,scope=relay,mode=max

      - name: Configure pinned SSH host and deployment key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          ssh_root="$RUNNER_TEMP/docnory-ssh"
          install -m 700 -d "$ssh_root"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_root/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$ssh_root/known_hosts"
          chmod 600 "$ssh_root/id_ed25519" "$ssh_root/known_hosts"
          ssh-keygen -y -f "$ssh_root/id_ed25519" >/dev/null

      - name: Deploy immutable images on VPS
        env:
          HOST_NAME: ${{ steps.image.outputs.host }}
          HOST_DIGEST: ${{ steps.host.outputs.digest }}
          RELAY_NAME: ${{ steps.image.outputs.relay }}
          RELAY_DIGEST: ${{ steps.relay.outputs.digest }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          : "${VPS_HOST:?Set the production VPS_HOST variable}"
          : "${VPS_USER:?Set the production VPS_USER variable}"
          : "${HOST_DIGEST:?Missing host digest}"
          : "${RELAY_DIGEST:?Missing relay digest}"
          VPS_PORT="${VPS_PORT:-22}"
          ssh_root="$RUNNER_TEMP/docnory-ssh"
          ssh -p "$VPS_PORT" -i "$ssh_root/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$ssh_root/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/docnory-deploy '$HOST_NAME@$HOST_DIGEST' '$RELAY_NAME@$RELAY_DIGEST'"

      - name: Verify public page
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          : "${PRODUCTION_URL:?Set the production PRODUCTION_URL variable}"
          curl --fail --show-error --silent \
            --retry 10 --retry-all-errors --retry-delay 3 \
            "${PRODUCTION_URL%/}/" -o "$RUNNER_TEMP/docnory-home.html"
          grep -q 'DocNory' "$RUNNER_TEMP/docnory-home.html"

      - name: Remove runner SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/docnory-ssh"
