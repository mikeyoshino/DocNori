name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run format:check && npm test && npm run build
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore
      - run: dotnet test tests/SabuySign.Relay.Tests --no-build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/seo.spec.ts
      - run: docker compose -f infra/compose.yaml config --quiet
      - run: docker compose -f infra/compose.yaml up --build -d web
      - run: npm run test:e2e
        env:
          APP_URL: http://127.0.0.1:8080
      - if: always()
        run: docker compose -f infra/compose.yaml down
