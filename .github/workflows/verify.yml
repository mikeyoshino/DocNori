name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      signing-db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: signingtests
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d signingtests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run format:check && npm test && npm run build
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build
        env:
          SIGNING_TEST_DATABASE: Host=localhost;Port=5432;Database=signingtests;Username=postgres;Password=ci-test-only
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/seo.spec.ts
      - run: docker compose -f infra/compose.yaml config --quiet
      - run: docker compose -f infra/compose.yaml up --build -d web
      - run: python3 scripts/test-word-sandbox.py "$(docker compose -f infra/compose.yaml images -q media-worker)"
      - run: npm run test:e2e
        env:
          APP_URL: http://127.0.0.1:8080
      - if: always()
        run: docker compose -f infra/compose.yaml down
