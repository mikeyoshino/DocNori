name: docnory-production

services:
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - /opt/docnory/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      backend:
      frontend:
        aliases:
          - docnory-web
    depends_on:
      - host
      - relay

  host:
    image: ${DOCNORY_HOST_IMAGE:?Set an immutable DocNory host image digest}
    restart: unless-stopped
    env_file:
      - /etc/docnory/signing.env
    depends_on:
      signing-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PublicOrigin: ${DOCNORY_PUBLIC_ORIGIN:?Set the public HTTPS origin}
    networks:
      - backend

  relay:
    image: ${DOCNORY_RELAY_IMAGE:?Set an immutable DocNory relay image digest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    networks:
      - backend

  signing-db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - /etc/docnory/signing.env
    environment:
      POSTGRES_DB: docnori_signing
      POSTGRES_USER: docnori_signing
    volumes:
      - signing-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U docnori_signing -d docnori_signing"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  signing-data:

networks:
  backend:
    internal: true
  frontend:
    name: toystore-production_frontend
    external: true
