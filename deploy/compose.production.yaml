name: docnory-production

services:
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - /opt/docnory/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      backend:
      frontend:
        aliases:
          - docnory-web
    depends_on:
      - host
      - relay
      - media-worker

  host:
    image: ${DOCNORY_HOST_IMAGE:?Set an immutable DocNory host image digest}
    restart: unless-stopped
    depends_on:
      signing-db:
        condition: service_healthy
    env_file:
      - /etc/docnory/signing.env
      - path: /etc/docnory/accounts.env
        required: false
    volumes:
      - media-data:/media
      - template-data:/templates
      - account-keys:/keys
    environment:
      MediaConversion__Enabled: "true"
      MediaConversion__StoragePath: /media
      Templates__StoragePath: /templates
      Accounts__DataProtectionPath: /keys
      Accounts__PublicOrigin: ${DOCNORY_PUBLIC_ORIGIN:?Set the public HTTPS origin}
      ASPNETCORE_ENVIRONMENT: Production
      PublicOrigin: ${DOCNORY_PUBLIC_ORIGIN:?Set the public HTTPS origin}
    networks:
      - backend
      - account-egress

  media-worker:
    image: ${DOCNORY_HOST_IMAGE:?Set an immutable DocNory host image digest}
    restart: unless-stopped
    env_file:
      - /etc/docnory/signing.env
    entrypoint: ["dotnet", "/app/worker/SabuySign.Media.Worker.dll"]
    environment:
      MediaConversion__MaxConcurrency: ${MEDIA_WORKER_CONCURRENCY:-0}
      MediaConversion__StoragePath: /media
    volumes:
      - media-data:/media
    networks:
      - backend
    depends_on:
      signing-db:
        condition: service_healthy
    mem_limit: ${MEDIA_WORKER_MEMORY:-2g}
    cpus: ${MEDIA_WORKER_CPUS:-1.0}
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  relay:
    image: ${DOCNORY_RELAY_IMAGE:?Set an immutable DocNory relay image digest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    networks:
      - backend

  signing-db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - /etc/docnory/signing.env
    environment:
      POSTGRES_DB: docnori_signing
      POSTGRES_USER: docnori_signing
    volumes:
      - signing-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U docnori_signing -d docnori_signing"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  template-data:
  account-keys:
  media-data:
  signing-data:

networks:
  account-egress:
  backend:
    internal: true
  frontend:
    name: toystore-production_frontend
    external: true
